name: Scrape Folkemødet Program

on:
  schedule:
    # Daily at 06:00 UTC = 08:00 CEST
    # Daily cron uses FAST_MODE for cheap incremental updates.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      max_events:
        description: 'Max events (leave empty for full scrape; e.g. 20 for test mode that does NOT commit)'
        required: false
        default: ''
      fast_mode:
        description: 'Fast mode: only translate genuinely new events (cheap). Disable for full freshness check.'
        type: boolean
        required: false
        default: true
      refetch_details:
        description: 'Re-fetch ALL event detail pages (more, speakers). Use once after a scraper bug fix.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install playwright@1.49.0
          npx playwright install chromium --with-deps

      - name: Determine run mode
        id: mode
        run: |
          MAX_EVENTS="${{ github.event.inputs.max_events }}"
          FAST_MODE="${{ github.event.inputs.fast_mode }}"
          REFETCH_DETAILS="${{ github.event.inputs.refetch_details }}"
          # Schedule (cron) runs default to FAST_MODE=1 for cheap daily updates
          if [ "${{ github.event_name }}" = "schedule" ]; then
            FAST_MODE="true"
            MAX_EVENTS=""
            REFETCH_DETAILS="false"
          fi
          # Default FAST_MODE to true if blank
          if [ -z "$FAST_MODE" ]; then
            FAST_MODE="true"
          fi
          if [ -z "$REFETCH_DETAILS" ]; then
            REFETCH_DETAILS="false"
          fi
          echo "MAX_EVENTS=$MAX_EVENTS" >> $GITHUB_OUTPUT
          echo "FAST_MODE=$FAST_MODE" >> $GITHUB_OUTPUT
          echo "REFETCH_DETAILS=$REFETCH_DETAILS" >> $GITHUB_OUTPUT
          echo "Mode: MAX_EVENTS=$MAX_EVENTS · FAST_MODE=$FAST_MODE · REFETCH_DETAILS=$REFETCH_DETAILS"

      - name: Run scraper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX_EVENTS: ${{ steps.mode.outputs.MAX_EVENTS }}
          FAST_MODE: ${{ steps.mode.outputs.FAST_MODE == 'true' && '1' || '0' }}
          REFETCH_DETAILS: ${{ steps.mode.outputs.REFETCH_DETAILS == 'true' && '1' || '0' }}
        run: node scripts/scrape.mjs

      - name: Upload test artifact (when MAX_EVENTS is set)
        if: steps.mode.outputs.MAX_EVENTS != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-program-json
          path: program.json
          retention-days: 3

      - name: Commit program.json if changed (full runs only)
        if: steps.mode.outputs.MAX_EVENTS == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The scraper output is a full snapshot, not an incremental patch.
          # If a concurrent push lands while we're scraping, attempting to
          # rebase causes inevitable conflicts (entire file diverges). Instead
          # we save our generated program.json, hard-reset to the remote tip,
          # restore our file, and commit on top.
          cp program.json /tmp/program.json.new

          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES…"

            # Fetch the latest remote state and align our branch to it
            git fetch origin main
            git reset --hard origin/main

            # Restore our freshly scraped program.json on top of the remote
            cp /tmp/program.json.new program.json
            git add program.json

            if git diff --staged --quiet; then
              echo "No changes after sync — nothing to commit"
              exit 0
            fi

            EVENTS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('program.json')).events.length)")
            git commit -m "Update program.json (${EVENTS} events)"

            if git push; then
              echo "✓ Pushed successfully on attempt $i"
              exit 0
            fi
            echo "Push rejected — retrying with fresh remote state…"
            sleep 3
          done
          echo "× Could not push after $MAX_RETRIES attempts"
          exit 1
