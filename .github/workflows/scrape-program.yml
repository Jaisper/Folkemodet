name: Scrape Folkemødet Program

on:
  schedule:
    # Daily at 06:00 UTC = 08:00 CEST
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Up from 45 — translation step adds ~5-15 min on first run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install playwright@1.49.0
          npx playwright install chromium --with-deps

      - name: Run scraper
        run: node scripts/scrape.mjs
        env:
          # When the GROQ_API_KEY repo-secret is set, the scraper translates
          # Danish titles + summaries to English via Groq (llama-3.3-70b-versatile).
          # Translations are cached in program.json so only NEW events incur cost.
          # If the secret is missing, scraping continues without translation.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit program.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add program.json
          if git diff --staged --quiet; then
            echo "No changes to program"
          else
            EVENTS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('program.json')).events.length)")
            git commit -m "Update program.json (${EVENTS} events)"

            MAX_RETRIES=5
            for i in $(seq 1 $MAX_RETRIES); do
              echo "Push attempt $i/$MAX_RETRIES…"
              if git push; then
                echo "✓ Pushed successfully"
                exit 0
              fi
              echo "Push rejected — pulling with rebase…"
              git pull --rebase origin main || {
                echo "Rebase failed, aborting"
                git rebase --abort 2>/dev/null || true
                exit 1
              }
              sleep 2
            done
            echo "× Could not push after $MAX_RETRIES attempts"
            exit 1
          fi
