name: Scrape Folkemødet Program

on:
  schedule:
    # Daily at 06:00 UTC = 08:00 CEST
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      max_events:
        description: 'Max events to scrape (leave blank for ALL ~3600). Use 100 for fast test.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install playwright@1.49.0
          npx playwright install chromium --with-deps

      - name: Run scraper
        run: node scripts/scrape.mjs
        env:
          # Pass MAX_EVENTS through only if provided in workflow_dispatch input
          MAX_EVENTS: ${{ github.event.inputs.max_events }}
          # If GROQ_API_KEY repo-secret is set, scraper translates titles + summaries to English.
          # Caches translations across runs so only new events incur API cost.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit program.json if changed
        # Skip commit when running in test mode (MAX_EVENTS set) to avoid polluting the live file
        if: github.event.inputs.max_events == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add program.json
          if git diff --staged --quiet; then
            echo "No changes to program"
          else
            EVENTS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('program.json')).events.length)")
            git commit -m "Update program.json (${EVENTS} events)"

            MAX_RETRIES=5
            for i in $(seq 1 $MAX_RETRIES); do
              echo "Push attempt $i/$MAX_RETRIESâ€¦"
              if git push; then
                echo "âœ“ Pushed successfully"
                exit 0
              fi
              echo "Push rejected â€” pulling with rebaseâ€¦"
              git pull --rebase origin main || {
                echo "Rebase failed, aborting"
                git rebase --abort 2>/dev/null || true
                exit 1
              }
              sleep 2
            done
            echo "Ã— Could not push after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Upload test artifact
        if: github.event.inputs.max_events != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-program-json
          path: program.json
          retention-days: 3
